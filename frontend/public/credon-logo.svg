<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06b6d4"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="cGrad" x1="50" y1="50" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softGlow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- Rounded square background -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="#09090b"/>
  <rect x="8" y="8" width="240" height="240" rx="52" stroke="url(#bgGrad)" stroke-width="3" opacity="0.6"/>
  <!-- Subtle orbital ring -->
  <ellipse cx="128" cy="128" rx="80" ry="80" fill="none" stroke="url(#bgGrad)" stroke-width="1.5" opacity="0.15"/>
  <!-- C letterform -->
  <path d="M176 80C162 66 144 58 124 58C82 58 52 88 52 128C52 168 82 198 124 198C144 198 162 190 176 176"
        stroke="url(#cGrad)" stroke-width="18" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <!-- AI brain node - top -->
  <circle cx="182" cy="78" r="10" fill="#22d3ee" filter="url(#softGlow)"/>
  <circle cx="182" cy="78" r="5" fill="white"/>
  <!-- AI brain node - middle -->
  <circle cx="192" cy="128" r="7" fill="#3b82f6" opacity="0.8"/>
  <circle cx="192" cy="128" r="3.5" fill="white" opacity="0.9"/>
  <!-- AI brain node - bottom -->
  <circle cx="182" cy="178" r="10" fill="#7c3aed" filter="url(#softGlow)"/>
  <circle cx="182" cy="178" r="5" fill="white"/>
  <!-- Neural connection lines -->
  <line x1="182" y1="88" x2="192" y2="121" stroke="#22d3ee" stroke-width="1.5" opacity="0.4"/>
  <line x1="192" y1="135" x2="182" y2="168" stroke="#7c3aed" stroke-width="1.5" opacity="0.4"/>
  <!-- Inner spark -->
  <circle cx="100" cy="128" r="3" fill="white" opacity="0.5"/>
</svg>