name: Keep backend warm

# The backend runs on Render's free tier, which spins the instance down after
# ~15 minutes of inactivity. The first request after that triggers a 30–60s cold
# boot that users experience as "Something went wrong while connecting to Credon
# Brain". This keyless workflow pings the public /health endpoint on a schedule
# so the instance stays awake. No secrets/API keys required.
#
# Note: GitHub's scheduled runs can be delayed under load, so this reduces cold
# starts but does not eliminate them. For tighter coverage, also point a free
# uptime monitor (e.g. cron-job.org / UptimeRobot, 5-min interval) at the same
# URL. The frontend warmup ping + patient retry remain the last line of defence.

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes (UTC)
  workflow_dispatch: {} # allow manual "wake it now" runs

permissions:
  contents: read

concurrency:
  group: keep-backend-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          BACKEND_URL: https://credon-ai-backend.onrender.com
        run: |
          echo "Pinging $BACKEND_URL/health"
          # Cold boots can take up to ~60s, so allow a generous timeout and
          # retry a few times before giving up. A non-2xx/timeout is not fatal —
          # the next scheduled run will try again.
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 90 --connect-timeout 20 \
              "$BACKEND_URL/health" || echo "000")
            echo "Attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Backend is awake."
              exit 0
            fi
            sleep 15
          done
          echo "::warning::Backend did not return 200 after 3 attempts (it may still be booting)."
