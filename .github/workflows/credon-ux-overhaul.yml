name: Credon UX Overhaul

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  overhaul:
    if: ${{ !contains(github.event.head_commit.message, '[credon-ux]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Credon product UX overhaul
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          page = Path('frontend/src/app/page.tsx')
          css = Path('frontend/src/app/globals.css')
          text = page.read_text()

          # 1. Remove the distracting manual folder chips from the sidebar.
          text = re.sub(
              r'\n\s*<div className="grid grid-cols-2 gap-1\.5 text-\[10px\] text-zinc-400">\s*\{\["Personal", "Study", "Coding", "Startup", "Research"\]\.map\(\(folder\) => <span key=\{folder\} className="rounded-lg border border-zinc-800/70 bg-zinc-900/45 px-2 py-1">\{folder\}</span>\)\}</div>',
              '', text, count=1)

          # 2. Replace the manual answer-style toolbar with a quiet, automatic UX.
          text = re.sub(
              r'\n\s*<div className="mt-2 flex flex-wrap items-center gap-1\.5 rounded-xl border border-zinc-800/60 bg-zinc-950/35 px-2 py-1\.5">\s*<span className="text-\[10px\] uppercase tracking-wide text-zinc-500">Answer style</span>\s*\{ANSWER_STYLES\.map\(\(style\) => \(.*?\)\}\s*</div>',
              '', text, count=1, flags=re.S)

          # 3. Desktop sidebar becomes genuinely collapsible instead of being permanently forced open.
          old_aside = 'fixed md:static inset-y-0 left-0 z-40 w-70 bg-zinc-950/75 backdrop-blur-2xl border-r border-cyan-400/10 flex flex-col transition-transform duration-200 ease-out md:translate-x-0 ${sidebarOpen ? "translate-x-0" : "-translate-x-full"}'
          new_aside = 'fixed inset-y-0 left-0 z-40 w-72 bg-zinc-950/90 backdrop-blur-2xl border-r border-zinc-800/80 flex flex-col transition-transform duration-200 ease-out ${sidebarOpen ? "translate-x-0" : "-translate-x-full"}'
          text = text.replace(old_aside, new_aside)

          # 4. Main canvas reserves room when the sidebar is open on desktop.
          text = text.replace(
              '<main className="flex-1 flex flex-col min-w-0">',
              '<main className={`flex-1 flex flex-col min-w-0 transition-[margin] duration-200 ${sidebarOpen ? "md:ml-72" : ""}`}>',
              1,
          )

          # 5. Make the sidebar toggle desktop-friendly and visually explicit.
          text = text.replace(
              'title="Toggle sidebar">',
              'title={sidebarOpen ? "Collapse sidebar" : "Open sidebar"} aria-label={sidebarOpen ? "Collapse sidebar" : "Open sidebar">',
              1,
          )

          # 6. Rename the model badge into a neutral automatic-router control.
          text = text.replace('Credon Alpha 1', 'Credon Auto', 2)
          text = text.replace('Multi-model AI with automatic routing &middot; Always picks the best model for your query', 'Automatic model routing · picks the best available path for each task')

          # 7. Remove explicit "dark cyan" wording and old theme labels.
          text = text.replace('Dark cyan', 'Graphite')
          text = text.replace('Midnight blue', 'Obsidian')

          # 8. Neutralize the old cyan-heavy visual language in Tailwind utility classes.
          text = text.replace('cyan-', 'violet-')
          text = text.replace('cyan_', 'violet_')

          page.write_text(text)

          styles = css.read_text()
          styles += r'''

          /* ═══════════════════════════════════════════════════════════
             CREDON 2026 PRODUCT SHELL — graphite / obsidian / indigo
             The goal is calm, premium, information-dense UI rather than
             a neon AI demo aesthetic.
             ═══════════════════════════════════════════════════════════ */
          :root {
            --background: #0b0b0d;
            --foreground: #f4f4f5;
            --accent: #8b5cf6;
            --accent-blue: #6366f1;
          }

          body {
            background:
              radial-gradient(900px 500px at 50% -20%, rgba(99,102,241,.10), transparent 62%),
              radial-gradient(700px 500px at 100% 100%, rgba(139,92,246,.06), transparent 65%),
              #0b0b0d;
            color: #f4f4f5;
          }

          .ambient-grid::before { opacity: .28; background-image:
            linear-gradient(rgba(139,92,246,.035) 1px, transparent 1px),
            linear-gradient(90deg, rgba(139,92,246,.035) 1px, transparent 1px);
          }

          .neo-glass {
            background: linear-gradient(145deg, rgba(24,24,27,.92), rgba(12,12,14,.94));
            border-color: rgba(255,255,255,.08) !important;
            box-shadow: 0 24px 80px rgba(0,0,0,.45);
          }

          .sidebar-item:hover { transform: none; }
          .message-bubble { animation-duration: .18s; }
          .suggestion-chip:hover { transform: translateY(-1px); box-shadow: 0 12px 30px rgba(0,0,0,.25); }

          /* Make text, borders and surfaces feel closer to modern research/coding tools. */
          textarea, input, select { font-variant-numeric: tabular-nums; }
          pre { border-radius: 14px !important; }

          @media (min-width: 768px) {
            /* Avoid the sidebar feeling like a permanent drawer. */
            aside { box-shadow: 12px 0 40px rgba(0,0,0,.18); }
          }
          '''
          css.write_text(styles)
          PY

      - name: Commit overhaul
        run: |
          git config user.name "Credon UX Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/page.tsx frontend/src/app/globals.css
          git diff --cached --quiet && exit 0
          git commit -m "[credon-ux] redesign Credon product shell"
          git push
